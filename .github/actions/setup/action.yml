name: Setup
description: Install the pinned bun and the frozen lockfile.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        # Keep in lockstep with packageManager and flake.nix.
        bun-version: 1.4.4
    - name: Install
      shell: bash
      run: |
        for attempt in 1 2 3; do
          bun install --frozen-lockfile && exit 0
          echo "bun install failed (attempt $attempt), retrying"
          sleep 5
        done
        exit 1
