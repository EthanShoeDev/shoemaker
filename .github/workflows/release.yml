name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The pinned npm (12) needs Node ^22.22.2 or >= 24.15; trusted publishing needs npm 11.5+.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Opens a "Version packages" PR from pending changesets; once that PR is
      # merged, publishes every package whose version is not on npm yet.
      - uses: changesets/action@v1
        with:
          version: bun run changeset:version
          publish: bun scripts/release.ts
          commit: 'chore: version packages'
          title: 'chore: version packages'
        # No NPM_TOKEN: npm authenticates through trusted publishing (OIDC,
        # the id-token permission above).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
