name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The pinned npm (12) needs Node ^22.22.2 or >= 24.15; trusted publishing needs npm 11.5+.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Opens a "Version packages" PR from pending changesets; once that PR is
      # merged, publishes every package whose version is not on npm yet, then
      # pushes the new tags and makes a GitHub release for each. v2 is the line
      # for Changesets 3: it learns the tags from what `changeset git-tag`
      # writes to CHANGESETS_OUTPUT. v1 parsed `New tag:` lines from stdout,
      # which Changesets 3 no longer prints, so it pushed no tags and made no
      # releases. No NPM_TOKEN: npm authenticates through trusted publishing
      # (OIDC, the id-token permission above).
      #
      # RELEASE_TOKEN is a fine-grained PAT (this repo only; Contents and Pull
      # requests read/write). GitHub holds CI on a PR that github-actions[bot]
      # pushed until someone approves it; pushed with the PAT, the version PR
      # runs CI on its own.
      - uses: changesets/action@v2
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          version-script: bun run changeset:version
          publish-script: bun scripts/release.ts
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
